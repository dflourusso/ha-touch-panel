name: Release Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 1.0.0)
        required: true
        type: string
      build_number:
        description: Build number (appended to project version)
        required: true
        type: string
        default: "1"
      device:
        description: Panel to build (site/panel) or all
        required: true
        type: choice
        options:
          - all
          - home/suite
        default: home/suite
      release_notes:
        description: Release notes
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve devices
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.resolve.outputs.files }}
      combined_name: ${{ steps.resolve.outputs.combined_name }}
      release_version: ${{ steps.resolve.outputs.release_version }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve factory YAML list
        id: resolve
        run: |
          set -euo pipefail
          device="${{ github.event.inputs.device }}"
          version="${{ github.event.inputs.version }}"
          build="${{ github.event.inputs.build_number }}"
          release_version="${version}+${build}"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

          files=""
          if [ "$device" = "all" ]; then
            while IFS= read -r f; do
              files+="${f}"$'\n'
            done < <(find sites -type f -name 'factory.yaml' | sort)
            combined_name="ha-touch-panel"
          else
            # Device id is <site>/<panel> → sites/<site>/panels/<panel>/factory.yaml
            site="${device%%/*}"
            panel="${device#*/}"
            factory="sites/${site}/panels/${panel}/factory.yaml"
            if [ ! -f "$factory" ]; then
              echo "Missing factory config: $factory" >&2
              exit 1
            fi
            files="${factory}"$'\n'
            combined_name="$(echo "$device" | tr '/' '-')"
          fi

          if [ -z "$(echo -n "$files")" ]; then
            echo "No factory.yaml files to build" >&2
            exit 1
          fi

          {
            echo "files<<EOF"
            printf "%s" "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "combined_name=${combined_name}" >> "$GITHUB_OUTPUT"
          echo "Building version ${release_version}"
          echo "Files:"
          printf "%s" "$files"

  build-firmware:
    name: Build Firmware
    needs: resolve
    uses: esphome/workflows/.github/workflows/build.yml@025a1e6255610c498ed590403b7e510b69e474df # 2026.4.1
    with:
      files: ${{ needs.resolve.outputs.files }}
      esphome-version: 2026.6.2
      combined-name: ${{ needs.resolve.outputs.combined_name }}
      release-summary: ${{ github.event.inputs.release_notes }}
      release-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.resolve.outputs.release_version }}
      release-version: ${{ needs.resolve.outputs.release_version }}

  upload-to-release:
    name: Upload to Release
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@025a1e6255610c498ed590403b7e510b69e474df # 2026.4.1
    needs:
      - resolve
      - build-firmware
    with:
      # Must match build artifact folder (version+build_number), not the bare semver input
      version: ${{ needs.resolve.outputs.release_version }}
