                              min_value: 16
                              max_value: 30
                              value: 24
                              adjustable: true
                              start_angle: 135
                              end_angle: 45
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_climate_setpoint
                                    text:
                                      format: "%.0f°C"
                                      args: [x]
                                - lambda: |-
                                    id(climate_setpoint) = (int) x;
                              on_release:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return (float) x;
                          - label:
                              id: lbl_climate_mode_word
                              align: CENTER
                              y: -36
                              text: "--"
                              text_font: font_roboto_18
                              text_color: 0x3B82F6
                          - label:
                              id: lbl_climate_setpoint
                              align: CENTER
                              text: "--°C"
                              text_font: font_roboto_48
                          - label:
                              id: lbl_climate_current
                              align: CENTER
                              y: 36
                              text: "--.- °C"
                              text_font: font_roboto_18
                              text_color: 0x9AA0A6
                          - button:
                              align: LEFT_MID
                              width: 52
                              height: 52
                              radius: 26
                              shadow_width: 0
                              on_click:
                                - lambda: |-
                                    int v = id(climate_setpoint);
                                    if (v > 16) v -= 1;
                                    id(climate_setpoint) = v;
                                - lvgl.arc.update:
                                    id: arc_climate_temp
                                    value: !lambda return id(climate_setpoint);
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return (float) id(climate_setpoint);
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "-"
                                    text_font: font_roboto_36
                          - button:
                              align: RIGHT_MID
                              width: 52
                              height: 52
                              radius: 26
                              shadow_width: 0
                              on_click:
                                - lambda: |-
                                    int v = id(climate_setpoint);
                                    if (v < 30) v += 1;
                                    id(climate_setpoint) = v;
                                - lvgl.arc.update:
                                    id: arc_climate_temp
                                    value: !lambda return id(climate_setpoint);
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return (float) id(climate_setpoint);
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "+"
                                    text_font: font_roboto_36

