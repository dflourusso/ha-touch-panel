# Shared LVGL shell for portrait 480x800 room panels.
# Expects substitutions from the panel:
#   panel_title, light_l1..l4, light_rgb, light_dimmer, cover_entity, climate_entity
# User-visible strings are PT-BR; IDs stay English.
#
# Keep the widget tree shallow — deep nested flex/obj wrappers overflow loopTask stack.

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  # Partial buffer — 100% plus the MIPI RGB framebuffer can boot-loop this board.
  buffer_size: 25%
  color_depth: 16
  # Portrait: panel timing stays 800x480; LVGL rotates presentation to 480x800.
  rotation: 90°
  bg_color: 0x0F1419
  text_font: font_roboto_18
  align: CENTER

  style_definitions:
    - id: style_card
      bg_color: 0x252A33
      bg_opa: COVER
      radius: 16
      border_width: 0
      shadow_width: 0
      pad_all: 10
      scrollbar_mode: "OFF"
    - id: style_header
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 6
      scrollbar_mode: "OFF"
    - id: style_page
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"
    - id: style_tab_bar
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"
    - id: style_tab_btn
      bg_opa: TRANSP
      radius: 0
      border_width: 0
      shadow_width: 0
      shadow_opa: TRANSP
      text_color: 0x9AA0A6

  theme:
    button:
      bg_color: 0x2E3540
      bg_opa: COVER
      radius: 14
      border_width: 0
      shadow_width: 0
      shadow_opa: TRANSP
      text_color: 0xE8EAED
      pressed:
        bg_color: 0x3D4654
      checked:
        bg_color: 0x3B82F6
        text_color: 0xFFFFFF
    label:
      text_color: 0xE8EAED
      text_font: font_roboto_18
    slider:
      bg_color: 0x3D4654
      radius: 20
      shadow_width: 0
      indicator:
        bg_color: 0x3B82F6
        radius: 20
      knob:
        bg_color: 0xFFFFFF
        border_width: 0
        shadow_width: 0
    arc:
      arc_color: 0x3D4654
      arc_width: 18
      indicator:
        arc_color: 0x3B82F6
        arc_width: 18
      knob:
        bg_color: 0xFFFFFF
        border_width: 0
        pad_all: 6
        shadow_width: 0
    switch:
      bg_color: 0x3D4654
      bg_opa: COVER
      shadow_width: 0
      checked:
        bg_color: 0x3D4654
      indicator:
        bg_color: 0x3D4654
        checked:
          bg_color: 0x3B82F6
      knob:
        bg_color: 0xFFFFFF
        border_width: 0
        shadow_width: 0

  top_layer:
    widgets:
      - obj:
          id: header_bar
          width: 100%
          height: 56
          align: TOP_MID
          styles: style_header
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
            pad_column: 8
          widgets:
            - label:
                id: header_title
                text: ${panel_title}
                text_font: font_roboto_22
            - obj:
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: ROW
                  flex_align_main: END
                  flex_align_cross: CENTER
                  pad_column: 8
                widgets:
                  - button:
                      id: btn_master_off
                      width: 140
                      height: 44
                      shadow_width: 0
                      widgets:
                        - label:
                            align: CENTER
                            text: "Desligar tudo"
                            text_font: font_roboto_14
                      on_click:
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_l1}
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_l2}
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_l3}
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_l4}
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_rgb}
                        - homeassistant.action:
                            action: light.turn_off
                            data:
                              entity_id: ${light_dimmer}
                        - homeassistant.action:
                            action: climate.set_hvac_mode
                            data:
                              entity_id: ${climate_entity}
                              hvac_mode: "off"
                        - lvgl.widget.hide: lbl_rgb_pct
                        - lvgl.widget.hide: slider_rgb_brightness
                        - lvgl.widget.hide: row_rgb_colors
                        - lvgl.widget.hide: lbl_dimmer_pct
                        - lvgl.widget.hide: slider_dimmer_brightness
                  - label:
                      id: lbl_header_temp
                      text: "--.-°C"
                      text_font: font_roboto_18
                      text_color: 0xE8EAED
                  - image:
                      id: img_header_climate
                      hidden: true
                      src: icon_climate_cool
                      image_recolor: 0x3B82F6
                      image_recolor_opa: COVER
                  - button:
                      id: btn_info
                      width: 44
                      height: 44
                      bg_opa: TRANSP
                      border_width: 0
                      shadow_width: 0
                      pad_all: 0
                      widgets:
                        - image:
                            align: CENTER
                            src: icon_info
                            image_recolor: 0xE8EAED
                            image_recolor_opa: COVER
                      on_click:
                        - lvgl.label.update:
                            id: info_firmware_value
                            text: !lambda |-
                              #ifdef ESPHOME_PROJECT_VERSION
                              return {ESPHOME_PROJECT_VERSION};
                              #else
                              return {"dev"};
                              #endif
                        - lvgl.label.update:
                            id: info_ip_value
                            text: !lambda |-
                              if (id(wifi_ip).has_state() && !id(wifi_ip).state.empty())
                                return id(wifi_ip).state;
                              return {"—"};
                        - lvgl.switch.update:
                            id: sw_info_sleep
                            state: !lambda return id(sleep_mode).state;
                        - lvgl.slider.update:
                            id: slider_display_brightness
                            value: !lambda |-
                              float min_b = ${display_brightness_min};
                              float actual = id(preferred_display_brightness);
                              float ui = (actual - min_b) / (1.0f - min_b) * 100.0f;
                              if (ui < 0.0f) ui = 0.0f;
                              if (ui > 100.0f) ui = 100.0f;
                              return ui;
                        - lvgl.label.update:
                            id: lbl_display_brightness_pct
                            text: !lambda |-
                              float min_b = ${display_brightness_min};
                              float actual = id(preferred_display_brightness);
                              float ui = (actual - min_b) / (1.0f - min_b) * 100.0f;
                              if (ui < 0.0f) ui = 0.0f;
                              if (ui > 100.0f) ui = 100.0f;
                              char buf[8];
                              snprintf(buf, sizeof(buf), "%.0f%%", ui);
                              return {buf};
                        - lvgl.widget.show: info_screen
                  - image:
                      id: header_wifi_icon
                      src: icon_wifi_connecting
                      image_recolor: 0xE8EAED
                      image_recolor_opa: COVER

      - obj:
          id: tab_bar
          width: 100%
          height: 56
          align: BOTTOM_MID
          styles: style_tab_bar
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: START
            flex_align_cross: CENTER
          widgets:
            - button:
                id: btn_tab_lights
                flex_grow: 1
                height: 56
                checkable: true
                styles: style_tab_btn
                state:
                  checked: true
                pressed:
                  bg_color: 0x3B82F6
                  bg_opa: 20%
                checked:
                  bg_opa: TRANSP
                  text_color: 0x3B82F6
                  border_side: [TOP]
                  border_width: 3
                  border_color: 0x3B82F6
                  border_opa: COVER
                widgets:
                  - label:
                      align: CENTER
                      text: "Luzes"
                      text_font: font_roboto_18
                on_click:
                  - lvgl.widget.update:
                      id: btn_tab_lights
                      state:
                        checked: true
                  - lvgl.widget.update:
                      id: btn_tab_climate
                      state:
                        checked: false
                  - lvgl.page.show:
                      id: page_lights
                      animation: NONE
            - button:
                id: btn_tab_climate
                flex_grow: 1
                height: 56
                checkable: true
                styles: style_tab_btn
                pressed:
                  bg_color: 0x3B82F6
                  bg_opa: 20%
                checked:
                  bg_opa: TRANSP
                  text_color: 0x3B82F6
                  border_side: [TOP]
                  border_width: 3
                  border_color: 0x3B82F6
                  border_opa: COVER
                widgets:
                  - label:
                      align: CENTER
                      text: "Clima / Persiana"
                      text_font: font_roboto_18
                on_click:
                  - lvgl.widget.update:
                      id: btn_tab_lights
                      state:
                        checked: false
                  - lvgl.widget.update:
                      id: btn_tab_climate
                      state:
                        checked: true
                  - lvgl.page.show:
                      id: page_climate
                      animation: NONE

      - obj:
          id: info_screen
          hidden: true
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x000000
          bg_opa: 70%
          radius: 0
          pad_all: 0
          border_width: 0
          scrollable: false
          clickable: true
          on_click:
            - lvgl.widget.hide: info_screen
          widgets:
            - obj:
                align: CENTER
                width: 400
                height: SIZE_CONTENT
                styles: style_card
                pad_all: 20
                clickable: true
                scrollable: false
                layout:
                  type: FLEX
                  flex_flow: COLUMN
                  flex_align_main: START
                  flex_align_cross: CENTER
                  pad_row: 10
                widgets:
                  - image:
                      src: logo_info
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "Ambiente"
                            text_font: font_roboto_18
                            text_color: 0x9AA0A6
                        - label:
                            id: info_room_value
                            text: ${panel_title}
                            text_font: font_roboto_18
                            text_align: RIGHT
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "Firmware"
                            text_font: font_roboto_18
                            text_color: 0x9AA0A6
                        - label:
                            id: info_firmware_value
                            text: "—"
                            text_font: font_roboto_18
                            text_align: RIGHT
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "Wi-Fi"
                            text_font: font_roboto_18
                            text_color: 0x9AA0A6
                        - label:
                            id: info_wifi_value
                            text: "Conectando…"
                            text_font: font_roboto_18
                            text_align: RIGHT
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "IP"
                            text_font: font_roboto_18
                            text_color: 0x9AA0A6
                        - label:
                            id: info_ip_value
                            text: "—"
                            text_font: font_roboto_18
                            text_align: RIGHT
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: ROW
                        flex_align_main: SPACE_BETWEEN
                        flex_align_cross: CENTER
                      widgets:
                        - label:
                            text: "Modo sono"
                            text_font: font_roboto_18
                            text_color: 0x9AA0A6
                        - switch:
                            id: sw_info_sleep
                            width: 64
                            height: 36
                            on_change:
                              - if:
                                  condition:
                                    lambda: return x;
                                  then:
                                    - switch.turn_on: sleep_mode
                                  else:
                                    - switch.turn_off: sleep_mode
                  - obj:
                      width: 100%
                      height: SIZE_CONTENT
                      bg_opa: TRANSP
                      border_width: 0
                      pad_all: 0
                      scrollable: false
                      layout:
                        type: FLEX
                        flex_flow: COLUMN
                        flex_align_main: START
                        flex_align_cross: CENTER
                        pad_row: 6
                      widgets:
                        - obj:
                            width: 100%
                            height: SIZE_CONTENT
                            bg_opa: TRANSP
                            border_width: 0
                            pad_all: 0
                            scrollable: false
                            layout:
                              type: FLEX
                              flex_flow: ROW
                              flex_align_main: SPACE_BETWEEN
                              flex_align_cross: CENTER
                            widgets:
                              - label:
                                  text: "Brilho"
                                  text_font: font_roboto_18
                                  text_color: 0x9AA0A6
                              - label:
                                  id: lbl_display_brightness_pct
                                  text: "100%"
                                  text_font: font_roboto_18
                                  text_align: RIGHT
                        - slider:
                            id: slider_display_brightness
                            width: 100%
                            height: 40
                            min_value: 0
                            max_value: 100
                            on_value:
                              - lvgl.label.update:
                                  id: lbl_display_brightness_pct
                                  text:
                                    format: "%.0f%%"
                                    args: ['x']
                            on_release:
                              - lambda: |-
                                  float min_b = ${display_brightness_min};
                                  float actual = min_b + x * (1.0f - min_b) / 100.0f;
                                  if (actual < min_b) actual = min_b;
                                  if (actual > 1.0f) actual = 1.0f;
                                  id(preferred_display_brightness) = actual;
                              - light.turn_on:
                                  id: display_backlight
                                  brightness: !lambda return id(preferred_display_brightness);
                  - button:
                      width: 100%
                      height: 44
                      shadow_width: 0
                      widgets:
                        - label:
                            align: CENTER
                            text: "Fechar"
                            text_font: font_roboto_18
                      on_click:
                        - lvgl.widget.hide: info_screen

      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0x0F1419
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          scrollable: false
          widgets:
            - image:
                align: CENTER
                src: logo_splash
          on_press:
            - lvgl.widget.hide: boot_screen

  pages:
    - id: page_lights
      skip: false
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            align: TOP_MID
            y: 64
            width: 456
            height: 668
            styles: style_page
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 10
            widgets:
              - buttonmatrix:
                  id: mtx_lights
                  width: 100%
                  height: 180
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  pad_row: 10
                  pad_column: 10
                  one_checked: false
                  items:
                    bg_color: 0x2E3540
                    bg_opa: COVER
                    radius: 14
                    border_width: 0
                    shadow_width: 0
                    text_color: 0xE8EAED
                    text_font: font_lights_btn
                    pressed:
                      bg_color: 0x3D4654
                    checked:
                      bg_color: 0x3B82F6
                      text_color: 0xFFFFFF
                  rows:
                    - buttons:
                        - id: btn_l4
                          text: "\U000F0335 Principal"
                          control:
                            checkable: true
                          on_click:
                            - homeassistant.action:
                                action: light.toggle
                                data:
                                  entity_id: ${light_l4}
                        - id: btn_l3
                          text: "\U000F0335 Sanca"
                          control:
                            checkable: true
                          on_click:
                            - homeassistant.action:
                                action: light.toggle
                                data:
                                  entity_id: ${light_l3}
                    - buttons:
                        - id: btn_l1
                          text: "\U000F0335 Spot TV"
                          control:
                            checkable: true
                          on_click:
                            - homeassistant.action:
                                action: light.toggle
                                data:
                                  entity_id: ${light_l1}
                        - id: btn_l2
                          text: "\U000F0335 Pendentes"
                          control:
                            checkable: true
                          on_click:
                            - homeassistant.action:
                                action: light.toggle
                                data:
                                  entity_id: ${light_l2}

              - obj:
                  width: 100%
                  height: SIZE_CONTENT
                  styles: style_card
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_row: 8
                  widgets:
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_BETWEEN
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              text: "\U000F0335 Rodapé"
                              text_font: font_lights_btn
                          - obj:
                              width: SIZE_CONTENT
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              pad_all: 0
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: END
                                flex_align_cross: CENTER
                                pad_column: 10
                              widgets:
                                - label:
                                    id: lbl_rgb_pct
                                    hidden: true
                                    text: "--%"
                                    text_font: font_roboto_18
                                - switch:
                                    id: sw_rgb_power
                                    width: 64
                                    height: 36
                                    on_change:
                                      - if:
                                          condition:
                                            lambda: return x;
                                          then:
                                            - lvgl.widget.show: lbl_rgb_pct
                                            - lvgl.widget.show: slider_rgb_brightness
                                            - lvgl.widget.show: row_rgb_colors
                                            - homeassistant.action:
                                                action: light.turn_on
                                                data:
                                                  entity_id: ${light_rgb}
                                          else:
                                            - lvgl.widget.hide: lbl_rgb_pct
                                            - lvgl.widget.hide: slider_rgb_brightness
                                            - lvgl.widget.hide: row_rgb_colors
                                            - lvgl.slider.update:
                                                id: slider_rgb_brightness
                                                indicator:
                                                  bg_color: 0x3B82F6
                                            - homeassistant.action:
                                                action: light.turn_off
                                                data:
                                                  entity_id: ${light_rgb}
                    - slider:
                        id: slider_rgb_brightness
                        hidden: true
                        width: 100%
                        height: 40
                        min_value: 1
                        max_value: 255
                        on_value:
                          - lvgl.label.update:
                              id: lbl_rgb_pct
                              text:
                                format: "%.0f%%"
                                args: ['x * 100.0 / 255.0']
                        on_release:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: ${light_rgb}
                                brightness: !lambda return int(x);
                    - obj:
                        id: row_rgb_colors
                        hidden: true
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_EVENLY
                          pad_column: 4
                        widgets:
                          - button:
                              width: 56
                              height: 36
                              bg_color: 0xFFCC66
                              radius: 8
                              shadow_width: 0
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "W"
                                    text_font: font_roboto_14
                              on_click:
                                - lvgl.slider.update:
                                    id: slider_rgb_brightness
                                    indicator:
                                      bg_color: 0xFFCC66
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      color_name: "orange"
                          - button:
                              width: 56
                              height: 36
                              bg_color: 0xEEF2FF
                              radius: 8
                              shadow_width: 0
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "C"
                                    text_color: 0x111111
                                    text_font: font_roboto_14
                              on_click:
                                - lvgl.slider.update:
                                    id: slider_rgb_brightness
                                    indicator:
                                      bg_color: 0xEEF2FF
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      color_name: "aliceblue"
                          - button:
                              width: 56
                              height: 36
                              bg_color: 0xE11D48
                              radius: 8
                              shadow_width: 0
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "R"
                                    text_font: font_roboto_14
                              on_click:
                                - lvgl.slider.update:
                                    id: slider_rgb_brightness
                                    indicator:
                                      bg_color: 0xE11D48
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      color_name: "red"
                          - button:
                              width: 56
                              height: 36
                              bg_color: 0x16A34A
                              radius: 8
                              shadow_width: 0
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "G"
                                    text_font: font_roboto_14
                              on_click:
                                - lvgl.slider.update:
                                    id: slider_rgb_brightness
                                    indicator:
                                      bg_color: 0x16A34A
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      color_name: "lime"
                          - button:
                              width: 56
                              height: 36
                              bg_color: 0x2563EB
                              radius: 8
                              shadow_width: 0
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "B"
                                    text_font: font_roboto_14
                              on_click:
                                - lvgl.slider.update:
                                    id: slider_rgb_brightness
                                    indicator:
                                      bg_color: 0x2563EB
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
