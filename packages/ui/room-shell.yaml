# Shared LVGL shell for portrait 480x800 room panels.
# Expects substitutions from the panel:
#   panel_title, light_l1..l4, light_rgb, light_dimmer, cover_entity, climate_entity
# User-visible strings are PT-BR; IDs stay English.

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  buffer_size: 100%
  color_depth: 16
  # Portrait: panel timing stays 800x480; LVGL rotates presentation to 480x800.
  rotation: 90°
  bg_color: 0x0F1419
  text_font: font_roboto_18
  align: CENTER

  style_definitions:
    - id: style_card
      bg_color: 0x252A33
      bg_opa: COVER
      radius: 16
      border_width: 0
      pad_all: 10
      scrollbar_mode: "OFF"
    - id: style_header
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 8
      scrollbar_mode: "OFF"
    - id: style_nav
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0
      scrollbar_mode: "OFF"
    - id: style_page
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"

  theme:
    button:
      bg_color: 0x2E3540
      bg_opa: COVER
      radius: 14
      border_width: 0
      text_color: 0xE8EAED
      pressed:
        bg_color: 0x3D4654
      checked:
        bg_color: 0x3B82F6
        text_color: 0xFFFFFF
    label:
      text_color: 0xE8EAED
      text_font: font_roboto_18
    slider:
      bg_color: 0x3D4654
      radius: 20
      indicator:
        bg_color: 0x3B82F6
        radius: 20
      knob:
        bg_color: 0xFFFFFF
        border_width: 0
    arc:
      arc_color: 0x3D4654
      arc_width: 18
      indicator:
        arc_color: 0x3B82F6
        arc_width: 18
      knob:
        bg_color: 0xFFFFFF
        border_width: 0
        pad_all: 6

  top_layer:
    widgets:
      - obj:
          id: header_bar
          width: 100%
          height: 48
          align: TOP_MID
          styles: style_header
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
            pad_column: 12
          widgets:
            - label:
                id: header_title
                text: ${panel_title}
                text_font: font_roboto_22
            - button:
                id: btn_master_off
                width: 148
                height: 36
                widgets:
                  - label:
                      align: CENTER
                      text: "Desligar tudo"
                      text_font: font_roboto_14
                on_click:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l1}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l2}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l3}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l4}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_rgb}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_dimmer}
      - obj:
          id: nav_bar
          width: 100%
          height: 52
          align: BOTTOM_MID
          styles: style_nav
          scrollable: false
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - button:
                id: nav_lights
                width: 180
                height: 40
                checkable: true
                state:
                  checked: true
                widgets:
                  - label:
                      align: CENTER
                      text: "Luzes"
                on_click:
                  - lvgl.page.show: page_lights
                  - lvgl.widget.update:
                      id: nav_lights
                      state:
                        checked: true
                  - lvgl.widget.update:
                      id: nav_climate
                      state:
                        checked: false
            - button:
                id: nav_climate
                width: 180
                height: 40
                checkable: true
                widgets:
                  - label:
                      align: CENTER
                      text: "Clima"
                on_click:
                  - lvgl.page.show: page_climate
                  - lvgl.widget.update:
                      id: nav_climate
                      state:
                        checked: true
                  - lvgl.widget.update:
                      id: nav_lights
                      state:
                        checked: false

  pages:
    - id: page_lights
      skip: false
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            align: TOP_LEFT
            y: 56
            x: 12
            width: 456
            height: 688
            styles: style_page
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 12
            widgets:
              - obj:
                  width: 100%
                  height: 166
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: ROW_WRAP
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_column: 10
                    pad_row: 10
                  widgets:
                    - button:
                        id: btn_l1
                        width: 216
                        height: 72
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l1
                              align: CENTER
                              text: "L1"
                              text_font: font_roboto_28
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l1}
                    - button:
                        id: btn_l2
                        width: 216
                        height: 72
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l2
                              align: CENTER
                              text: "L2"
                              text_font: font_roboto_28
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l2}
                    - button:
                        id: btn_l3
                        width: 216
                        height: 72
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l3
                              align: CENTER
                              text: "L3"
                              text_font: font_roboto_28
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l3}
                    - button:
                        id: btn_l4
                        width: 216
                        height: 72
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l4
                              align: CENTER
                              text: "L4"
                              text_font: font_roboto_28
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l4}

              - obj:
                  width: 100%
                  height: 510
                  bg_opa: TRANSP
                  border_width: 0
                  scrollable: false
                  scrollbar_mode: "OFF"
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                    pad_column: 12
                  widgets:
                    - obj:
                        width: 216
                        height: 510
                        styles: style_card
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_row: 8
                        widgets:
                          - label:
                              text: "RGB Suíte"
                              text_font: font_roboto_18
                          - label:
                              id: lbl_rgb_pct
                              text: "--%"
                              text_font: font_roboto_48
                          - slider:
                              id: slider_rgb_brightness
                              width: 56
                              height: 280
                              min_value: 1
                              max_value: 255
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_rgb_pct
                                    text:
                                      format: "%.0f%%"
                                      args: ['x * 100.0 / 255.0']
                              on_release:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      brightness: !lambda return int(x);
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              scrollable: false
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: CENTER
                                pad_column: 4
                              widgets:
                                - button:
                                    width: 36
                                    height: 32
                                    bg_color: 0xFFCC66
                                    radius: 8
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "W"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "255,200,120"
                                - button:
                                    width: 36
                                    height: 32
                                    bg_color: 0xEEF2FF
                                    radius: 8
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "C"
                                          text_color: 0x111111
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "200,220,255"
                                - button:
                                    width: 36
                                    height: 32
                                    bg_color: 0xE11D48
                                    radius: 8
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "R"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "255,40,40"
                                - button:
                                    width: 36
                                    height: 32
                                    bg_color: 0x16A34A
                                    radius: 8
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "G"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "40,200,80"
                                - button:
                                    width: 36
                                    height: 32
                                    bg_color: 0x2563EB
                                    radius: 8
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "B"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "40,100,255"
                          - button:
                              id: btn_rgb_power
                              width: 56
                              height: 56
                              checkable: true
                              radius: 28
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "I/O"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: light.toggle
                                    data:
                                      entity_id: ${light_rgb}

                    - obj:
                        width: 216
                        height: 510
                        styles: style_card
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_row: 8
                        widgets:
                          - label:
                              text: "Cabeceira"
                              text_font: font_roboto_18
                          - label:
                              id: lbl_dimmer_pct
                              text: "--%"
                              text_font: font_roboto_48
                          - slider:
                              id: slider_dimmer_brightness
                              width: 56
                              height: 320
                              min_value: 1
                              max_value: 255
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_dimmer_pct
                                    text:
                                      format: "%.0f%%"
                                      args: ['x * 100.0 / 255.0']
                              on_release:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_dimmer}
                                      brightness: !lambda return int(x);
                          - button:
                              id: btn_dimmer_power
                              width: 56
                              height: 56
                              checkable: true
                              radius: 28
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "I/O"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: light.toggle
                                    data:
                                      entity_id: ${light_dimmer}

    - id: page_climate
      skip: true
      scrollable: false
      scrollbar_mode: "OFF"
      widgets:
        - obj:
            align: TOP_LEFT
            y: 56
            x: 12
            width: 456
            height: 688
            styles: style_page
            scrollable: false
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 12
            widgets:
              - obj:
                  width: 100%
                  height: 524
                  styles: style_card
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 10
                  widgets:
                    - obj:
                        width: 280
                        height: 280
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        widgets:
                          - arc:
                              id: arc_climate_temp
                              align: CENTER
                              width: 280
                              height: 280
                              min_value: 160
                              max_value: 300
                              value: 240
                              adjustable: true
                              start_angle: 135
                              end_angle: 45
                              on_value:
                                - lvgl.label.update:
                                    id: lbl_climate_setpoint
                                    text:
                                      format: "%.1f°C"
                                      args: ['x / 10.0']
                                - lambda: |-
                                    id(climate_setpoint_x10) = (int) x;
                              on_release:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return x / 10.0f;
                          - label:
                              id: lbl_climate_mode_word
                              align: CENTER
                              y: -48
                              text: "--"
                              text_font: font_roboto_18
                              text_color: 0x3B82F6
                          - label:
                              id: lbl_climate_setpoint
                              align: CENTER
                              text: "--.-°C"
                              text_font: font_roboto_56
                          - label:
                              id: lbl_climate_current
                              align: CENTER
                              y: 48
                              text: "--.- °C"
                              text_font: font_roboto_18
                              text_color: 0x9AA0A6

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: CENTER
                          flex_align_cross: CENTER
                          pad_column: 36
                        widgets:
                          - button:
                              width: 64
                              height: 64
                              radius: 32
                              on_click:
                                - lambda: |-
                                    int v = id(climate_setpoint_x10);
                                    if (v > 160) v -= 5;
                                    id(climate_setpoint_x10) = v;
                                - lvgl.arc.update:
                                    id: arc_climate_temp
                                    value: !lambda return id(climate_setpoint_x10);
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return id(climate_setpoint_x10) / 10.0f;
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "-"
                                    text_font: font_roboto_36
                          - button:
                              width: 64
                              height: 64
                              radius: 32
                              on_click:
                                - lambda: |-
                                    int v = id(climate_setpoint_x10);
                                    if (v < 300) v += 5;
                                    id(climate_setpoint_x10) = v;
                                - lvgl.arc.update:
                                    id: arc_climate_temp
                                    value: !lambda return id(climate_setpoint_x10);
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return id(climate_setpoint_x10) / 10.0f;
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "+"
                                    text_font: font_roboto_36

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_EVENLY
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - button:
                              id: btn_hvac_off
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Desligado"
                                    text_font: font_roboto_14
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      hvac_mode: "off"
                          - button:
                              id: btn_hvac_cool
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Frio"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      hvac_mode: "cool"
                          - button:
                              id: btn_hvac_heat
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Quente"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_hvac_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      hvac_mode: "heat"

                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_EVENLY
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - button:
                              id: btn_fan_focus
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Foco"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      fan_mode: "focus"
                          - button:
                              id: btn_fan_auto
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Auto"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      fan_mode: "auto"
                          - button:
                              id: btn_fan_high
                              width: 132
                              height: 48
                              checkable: true
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "Alto"
                                    text_font: font_roboto_18
                              on_click:
                                - homeassistant.action:
                                    action: climate.set_fan_mode
                                    data:
                                      entity_id: ${climate_entity}
                                      fan_mode: "high"

              - obj:
                  width: 100%
                  height: 152
                  styles: style_card
                  scrollable: false
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: SPACE_EVENLY
                    flex_align_cross: CENTER
                    pad_row: 10
                  widgets:
                    - label:
                        text: "Persiana suíte"
                        text_font: font_roboto_22
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        scrollable: false
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: SPACE_EVENLY
                          flex_align_cross: CENTER
                          pad_column: 10
                        widgets:
                          - button:
                              id: btn_cover_open
                              width: 132
                              height: 64
                              widgets:
                                - label:
                                    id: lbl_cover_open
                                    align: CENTER
                                    text: "Abrir"
                                    text_font: font_roboto_22
                              on_click:
                                - homeassistant.action:
                                    action: cover.open_cover
                                    data:
                                      entity_id: ${cover_entity}
                          - button:
                              id: btn_cover_stop
                              width: 132
                              height: 64
                              widgets:
                                - label:
                                    id: lbl_cover_stop
                                    align: CENTER
                                    text: "Parar"
                                    text_font: font_roboto_22
                              on_click:
                                - homeassistant.action:
                                    action: cover.stop_cover
                                    data:
                                      entity_id: ${cover_entity}
                          - button:
                              id: btn_cover_close
                              width: 132
                              height: 64
                              widgets:
                                - label:
                                    id: lbl_cover_close
                                    align: CENTER
                                    text: "Fechar"
                                    text_font: font_roboto_22
                              on_click:
                                - homeassistant.action:
                                    action: cover.close_cover
                                    data:
                                      entity_id: ${cover_entity}
