                              id: lbl_dimmer_pct
                              text:
                                format: "%.0f%%"
                                args: ['x * 100.0 / 255.0']
                        on_release:
                          - homeassistant.action:
                              action: light.turn_on
                              data:
                                entity_id: ${light_dimmer}
                                brightness: !lambda return int(x);

