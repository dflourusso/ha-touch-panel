# Shared LVGL shell for 800x480 room panels.
# Expects substitutions from the panel:
#   panel_title, light_l1..l4, light_rgb, light_dimmer, cover_entity, climate_entity

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  buffer_size: 100%
  color_depth: 16
  bg_color: 0x1A1D23
  text_font: font_roboto_18
  align: CENTER

  style_definitions:
    - id: style_card
      bg_color: 0x252A33
      bg_opa: COVER
      radius: 12
      border_width: 0
      pad_all: 10
    - id: style_header
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0
      pad_all: 8
    - id: style_nav
      bg_color: 0x12151A
      bg_opa: COVER
      radius: 0
      border_width: 0

  theme:
    button:
      bg_color: 0x2E3540
      bg_opa: COVER
      radius: 10
      border_width: 0
      text_color: 0xE8EAED
      pressed:
        bg_color: 0x3D4654
      checked:
        bg_color: 0x3B82F6
        text_color: 0xFFFFFF
    label:
      text_color: 0xE8EAED
      text_font: font_roboto_18
    slider:
      bg_color: 0x3D4654
      indicator:
        bg_color: 0x3B82F6
      knob:
        bg_color: 0xFFFFFF
        border_width: 0

  top_layer:
    widgets:
      - obj:
          id: header_bar
          width: 100%
          height: 48
          align: TOP_MID
          styles: style_header
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_BETWEEN
            flex_align_cross: CENTER
            pad_column: 12
          widgets:
            - label:
                id: header_title
                text: ${panel_title}
                text_font: font_roboto_22
            - button:
                id: btn_master_off
                width: 140
                height: 36
                widgets:
                  - label:
                      align: CENTER
                      text: "Master Off"
                      text_font: font_roboto_18
                on_click:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l1}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l2}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l3}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_l4}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_rgb}
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: ${light_dimmer}
      - obj:
          id: nav_bar
          width: 100%
          height: 52
          align: BOTTOM_MID
          styles: style_nav
          layout:
            type: FLEX
            flex_flow: ROW
            flex_align_main: SPACE_EVENLY
            flex_align_cross: CENTER
          widgets:
            - button:
                id: nav_lights
                width: 180
                height: 40
                checkable: true
                state:
                  checked: true
                widgets:
                  - label:
                      align: CENTER
                      text: "Lights"
                on_click:
                  - lvgl.page.show: page_lights
                  - lvgl.widget.update:
                      id: nav_lights
                      state:
                        checked: true
                  - lvgl.widget.update:
                      id: nav_climate
                      state:
                        checked: false
            - button:
                id: nav_climate
                width: 180
                height: 40
                checkable: true
                widgets:
                  - label:
                      align: CENTER
                      text: "Climate / Cover"
                on_click:
                  - lvgl.page.show: page_climate
                  - lvgl.widget.update:
                      id: nav_climate
                      state:
                        checked: true
                  - lvgl.widget.update:
                      id: nav_lights
                      state:
                        checked: false

  pages:
    - id: page_lights
      skip: false
      widgets:
        - obj:
            align: TOP_LEFT
            y: 56
            x: 12
            width: 776
            height: 360
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: FLEX
              flex_flow: COLUMN
              pad_row: 12
            widgets:
              - obj:
                  width: 100%
                  height: 150
                  styles: style_card
                  layout:
                    type: FLEX
                    flex_flow: ROW_WRAP
                    pad_column: 10
                    pad_row: 10
                  widgets:
                    - button:
                        id: btn_l1
                        width: 175
                        height: 60
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l1
                              align: CENTER
                              text: "L1"
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l1}
                    - button:
                        id: btn_l2
                        width: 175
                        height: 60
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l2
                              align: CENTER
                              text: "L2"
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l2}
                    - button:
                        id: btn_l3
                        width: 175
                        height: 60
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l3
                              align: CENTER
                              text: "L3"
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l3}
                    - button:
                        id: btn_l4
                        width: 175
                        height: 60
                        checkable: true
                        widgets:
                          - label:
                              id: lbl_l4
                              align: CENTER
                              text: "L4"
                        on_click:
                          - homeassistant.action:
                              action: light.toggle
                              data:
                                entity_id: ${light_l4}

              - obj:
                  width: 100%
                  height: 190
                  bg_opa: TRANSP
                  border_width: 0
                  layout:
                    type: FLEX
                    flex_flow: ROW
                    pad_column: 12
                  widgets:
                    - obj:
                        width: 378
                        height: 100%
                        styles: style_card
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          pad_row: 8
                        widgets:
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: CENTER
                              widgets:
                                - label:
                                    text: "RGB Suite"
                                    text_font: font_roboto_18
                                - button:
                                    id: btn_rgb_power
                                    width: 72
                                    height: 36
                                    checkable: true
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "On/Off"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.toggle
                                          data:
                                            entity_id: ${light_rgb}
                          - label:
                              text: "Brightness"
                              text_font: font_roboto_14
                          - slider:
                              id: slider_rgb_brightness
                              width: 100%
                              height: 28
                              min_value: 1
                              max_value: 255
                              on_release:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_rgb}
                                      brightness: !lambda return int(x);
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                pad_column: 8
                              widgets:
                                - button:
                                    width: 52
                                    height: 36
                                    bg_color: 0xFFCC66
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "W"
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "255,200,120"
                                - button:
                                    width: 52
                                    height: 36
                                    bg_color: 0xEEF2FF
                                    text_color: 0x111111
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "C"
                                          text_color: 0x111111
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "200,220,255"
                                - button:
                                    width: 52
                                    height: 36
                                    bg_color: 0xE11D48
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "R"
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "255,40,40"
                                - button:
                                    width: 52
                                    height: 36
                                    bg_color: 0x16A34A
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "G"
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "40,200,80"
                                - button:
                                    width: 52
                                    height: 36
                                    bg_color: 0x2563EB
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "B"
                                    on_click:
                                      - homeassistant.action:
                                          action: light.turn_on
                                          data:
                                            entity_id: ${light_rgb}
                                            rgb_color: "40,100,255"

                    - obj:
                        width: 378
                        height: 100%
                        styles: style_card
                        layout:
                          type: FLEX
                          flex_flow: COLUMN
                          pad_row: 8
                        widgets:
                          - obj:
                              width: 100%
                              height: SIZE_CONTENT
                              bg_opa: TRANSP
                              border_width: 0
                              layout:
                                type: FLEX
                                flex_flow: ROW
                                flex_align_main: SPACE_BETWEEN
                                flex_align_cross: CENTER
                              widgets:
                                - label:
                                    text: "Cabeceira"
                                    text_font: font_roboto_18
                                - button:
                                    id: btn_dimmer_power
                                    width: 72
                                    height: 36
                                    checkable: true
                                    widgets:
                                      - label:
                                          align: CENTER
                                          text: "On/Off"
                                          text_font: font_roboto_14
                                    on_click:
                                      - homeassistant.action:
                                          action: light.toggle
                                          data:
                                            entity_id: ${light_dimmer}
                          - label:
                              text: "Brightness"
                              text_font: font_roboto_14
                          - slider:
                              id: slider_dimmer_brightness
                              width: 100%
                              height: 28
                              min_value: 1
                              max_value: 255
                              on_release:
                                - homeassistant.action:
                                    action: light.turn_on
                                    data:
                                      entity_id: ${light_dimmer}
                                      brightness: !lambda return int(x);

    - id: page_climate
      skip: true
      widgets:
        - obj:
            align: TOP_LEFT
            y: 56
            x: 12
            width: 776
            height: 360
            bg_opa: TRANSP
            border_width: 0
            layout:
              type: FLEX
              flex_flow: ROW
              pad_column: 12
            widgets:
              - obj:
                  width: 480
                  height: 100%
                  styles: style_card
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    pad_row: 12
                  widgets:
                    - label:
                        text: "Climate"
                        text_font: font_roboto_22
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          pad_column: 16
                        widgets:
                          - label:
                              id: lbl_climate_current
                              text: "--.- C"
                              text_font: font_roboto_36
                          - label:
                              id: lbl_climate_setpoint_caption
                              text: "Setpoint"
                              text_font: font_roboto_14
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_cross: CENTER
                          pad_column: 12
                        widgets:
                          - button:
                              width: 64
                              height: 56
                              on_click:
                                - lvgl.spinbox.decrement: spinbox_climate_temp
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "-"
                                    text_font: font_roboto_28
                          - spinbox:
                              id: spinbox_climate_temp
                              width: 110
                              height: 56
                              text_align: CENTER
                              text_font: font_roboto_28
                              range_from: 16
                              range_to: 30
                              selected_digit: 0
                              rollover: false
                              digits: 3
                              decimal_places: 1
                              on_value:
                                - homeassistant.action:
                                    action: climate.set_temperature
                                    data:
                                      entity_id: ${climate_entity}
                                      temperature: !lambda return x;
                          - button:
                              width: 64
                              height: 56
                              on_click:
                                - lvgl.spinbox.increment: spinbox_climate_temp
                              widgets:
                                - label:
                                    align: CENTER
                                    text: "+"
                                    text_font: font_roboto_28
                    - obj:
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_width: 0
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          pad_column: 10
                        widgets:
                          - button:
                              id: btn_hvac_mode
                              width: 210
                              height: 52
                              widgets:
                                - label:
                                    id: lbl_hvac_mode
                                    align: CENTER
                                    text: "Mode: --"
                              on_click:
                                - script.execute: cycle_hvac_mode
                          - button:
                              id: btn_fan_mode
                              width: 210
                              height: 52
                              widgets:
                                - label:
                                    id: lbl_fan_mode
                                    align: CENTER
                                    text: "Fan: --"
                              on_click:
                                - script.execute: cycle_fan_mode

              - obj:
                  width: 272
                  height: 100%
                  styles: style_card
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    pad_row: 12
                  widgets:
                    - label:
                        text: "Persiana"
                        text_font: font_roboto_22
                    - label:
                        id: lbl_cover_pos
                        text: "--%"
                        text_font: font_roboto_28
                    - button:
                        id: btn_cover_open
                        width: 200
                        height: 56
                        widgets:
                          - label:
                              id: lbl_cover_open
                              align: CENTER
                              text: "Open"
                              text_font: font_roboto_22
                        on_click:
                          - homeassistant.action:
                              action: cover.open_cover
                              data:
                                entity_id: ${cover_entity}
                    - button:
                        id: btn_cover_stop
                        width: 200
                        height: 56
                        widgets:
                          - label:
                              id: lbl_cover_stop
                              align: CENTER
                              text: "Stop"
                              text_font: font_roboto_22
                        on_click:
                          - homeassistant.action:
                              action: cover.stop_cover
                              data:
                                entity_id: ${cover_entity}
                    - button:
                        id: btn_cover_close
                        width: 200
                        height: 56
                        widgets:
                          - label:
                              id: lbl_cover_close
                              align: CENTER
                              text: "Close"
                              text_font: font_roboto_22
                        on_click:
                          - homeassistant.action:
                              action: cover.close_cover
                              data:
                                entity_id: ${cover_entity}
