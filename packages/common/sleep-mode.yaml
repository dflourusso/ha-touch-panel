# Toggleable sleep mode: when ON, idle timeout blanks the backlight and pauses LVGL.
# First touch wakes (resume + backlight) without activating widgets underneath.
# Schedule on/off from Home Assistant automations — not hard-coded here.
#
# Expects substitution (optional, default below):
#   sleep_idle_timeout — e.g. "60s"
# Expects (from hardware package):
#   display_backlight, preferred_display_brightness, display_brightness_min
# Expects (from UI package):
#   sw_info_sleep — LVGL switch on the info overlay

substitutions:
  sleep_idle_timeout: "60s"

switch:
  - platform: template
    name: Sleep Mode
    id: sleep_mode
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "Sleep mode enabled"
      - lvgl.switch.update:
          id: sw_info_sleep
          state: true
    turn_off_action:
      - logger.log: "Sleep mode disabled"
      - lvgl.switch.update:
          id: sw_info_sleep
          state: false
      - light.turn_on:
          id: display_backlight
          brightness: !lambda |-
            float b = id(preferred_display_brightness);
            float min_b = ${display_brightness_min};
            if (b < min_b) b = min_b;
            if (b > 1.0f) b = 1.0f;
            return b;
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:

lvgl:
  on_idle:
    - timeout: ${sleep_idle_timeout}
      then:
        - if:
            condition:
              switch.is_on: sleep_mode
            then:
              - light.turn_off: display_backlight
              - lvgl.pause:
