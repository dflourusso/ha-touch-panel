# Shared API + first-time Wi-Fi provisioning (no home Wi-Fi secrets).
# USB Improv (serial) may fail on this board: GT911 uses GPIO19/20 (USB-Serial-JTAG).
# SoftAP + BLE Improv are reliable fallbacks.

api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ap:
    ssid: "TouchPanel-Setup"
    password: "touchpanel-setup"

captive_portal:

improv_serial:
  next_url: https://dflourusso.github.io/ha-touch-panel/

esp32_improv:
  authorizer: none

binary_sensor:
  - platform: status
    name: Status
    id: ha_api_status

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address
      id: wifi_ip
    ssid:
      name: SSID
      id: wifi_ssid_info

sensor:
  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic
