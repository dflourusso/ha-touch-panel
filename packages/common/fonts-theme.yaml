# Shared fonts for LVGL panels (portrait 480x800).

font:
  - file: "gfonts://Roboto"
    id: font_roboto_14
    size: 14
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_18
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_22
    size: 22
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_28
    size: 28
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_36
    size: 36
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_48
    size: 48
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Roboto"
    id: font_roboto_56
    size: 56
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  # Latin + mdi-lightbulb for named light buttonmatrix labels
  - file: "gfonts://Roboto"
    id: font_lights_btn
    size: 20
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - "\U000F0335"
  # Latin + MDI glyphs for climate / cover action buttons
  - file: "gfonts://Roboto"
    id: font_climate_btn
    size: 18
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    extras:
      - file: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
        glyphs:
          - "\U000F0425"  # power
          - "\U000F0716"  # snowflake
          - "\U000F0238"  # fire
          - "\U000F0594"  # weather-night
          - "\U000F171A"  # fan-auto
          - "\U000F1472"  # fan-speed-3
          - "\U000F005D"  # arrow-up-bold
          - "\U000F04DB"  # stop
          - "\U000F0045"  # arrow-down-bold
