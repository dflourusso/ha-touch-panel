# Suite touch panel — Guition JC8048W550
# Entity bindings + live state for Home Assistant.

substitutions:
  device_name: home-suite
  friendly_name: Suite Panel
  panel_title: "Suíte"

  light_l1: light.suite_switch_suite_l1
  light_l2: light.suite_switch_suite_l2
  light_l3: light.suite_switch_suite_l3
  light_l4: light.suite_switch_suite_l4
  light_rgb: light.rgb_suite
  light_dimmer: light.led_cabeceira_suite
  cover_entity: cover.persiana_suite
  climate_entity: climate.suite_2

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  min_version: 2026.6.0
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - light.turn_on:
          id: display_backlight
          brightness: 80%
      - delay: 1s
      - lvgl.widget.hide: boot_screen

packages:
  hardware: !include ../../../../hardware/guition-jc8048w550.yaml
  api_wifi: !include ../../../../packages/common/api-wifi.yaml
  fonts: !include ../../../../packages/common/fonts-theme.yaml
  branding: !include ../../../../packages/ui/branding.yaml
  ui: !include ../../../../packages/ui/room-shell.yaml

globals:
  - id: climate_setpoint
    type: int
    restore_value: false
    initial_value: "24"

# ---- Live state: lights (on/off) ----
binary_sensor:
  - platform: homeassistant
    id: ha_l1
    entity_id: ${light_l1}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_l1
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: ha_l2
    entity_id: ${light_l2}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_l2
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: ha_l3
    entity_id: ${light_l3}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_l3
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: ha_l4
    entity_id: ${light_l4}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: btn_l4
          state:
            checked: !lambda return x;

  - platform: homeassistant
    id: ha_rgb_on
    entity_id: ${light_rgb}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: sw_rgb_power
          state:
            checked: !lambda return x;
      - if:
          condition:
            lambda: return !x;
          then:
            - lvgl.label.update:
                id: lbl_rgb_pct
                text: "--%"

  - platform: homeassistant
    id: ha_dimmer_on
    entity_id: ${light_dimmer}
    trigger_on_initial_state: true
    on_state:
      - lvgl.widget.update:
          id: sw_dimmer_power
          state:
            checked: !lambda return x;
      - if:
          condition:
            lambda: return !x;
          then:
            - lvgl.label.update:
                id: lbl_dimmer_pct
                text: "--%"

# ---- Live state: brightness / climate numbers ----
sensor:
  - platform: homeassistant
    id: ha_rgb_brightness
    entity_id: ${light_rgb}
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: return !isnan(x);
          then:
            - lvgl.slider.update:
                id: slider_rgb_brightness
                value: !lambda return x;
            - lvgl.label.update:
                id: lbl_rgb_pct
                text:
                  format: "%.0f%%"
                  args: ["x * 100.0f / 255.0f"]
          else:
            - lvgl.label.update:
                id: lbl_rgb_pct
                text: "--%"

  - platform: homeassistant
    id: ha_dimmer_brightness
    entity_id: ${light_dimmer}
    attribute: brightness
    on_value:
      - if:
          condition:
            lambda: return !isnan(x);
          then:
            - lvgl.slider.update:
                id: slider_dimmer_brightness
                value: !lambda return x;
            - lvgl.label.update:
                id: lbl_dimmer_pct
                text:
                  format: "%.0f%%"
                  args: ["x * 100.0f / 255.0f"]
          else:
            - lvgl.label.update:
                id: lbl_dimmer_pct
                text: "--%"

  - platform: homeassistant
    id: ha_climate_current
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      - lvgl.label.update:
          id: lbl_climate_current
          text:
            format: "%.1f °C"
            args: [x]

  - platform: homeassistant
    id: ha_climate_setpoint
    entity_id: ${climate_entity}
    attribute: temperature
    on_value:
      - lambda: |-
          id(climate_setpoint) = (int) roundf(x);
      - lvgl.arc.update:
          id: arc_climate_temp
          value: !lambda return id(climate_setpoint);
      - lvgl.label.update:
          id: lbl_climate_setpoint
          text:
            format: "%.0f°C"
            args: ["(float) id(climate_setpoint)"]

# ---- Live state: climate mode / fan ----
text_sensor:
  - platform: homeassistant
    id: ha_hvac_mode
    entity_id: ${climate_entity}
    on_value:
      - lvgl.widget.update:
          id: btn_hvac_off
          state:
            checked: !lambda return x == "off";
      - lvgl.widget.update:
          id: btn_hvac_cool
          state:
            checked: !lambda return x == "cool";
      - lvgl.widget.update:
          id: btn_hvac_heat
          state:
            checked: !lambda return x == "heat";
      - lvgl.label.update:
          id: lbl_climate_mode_word
          text: !lambda |-
            if (x == "cool") return "Frio";
            if (x == "heat") return "Quente";
            if (x == "off") return "Desligado";
            return x.c_str();

  - platform: homeassistant
    id: ha_fan_mode
    entity_id: ${climate_entity}
    attribute: fan_mode
    on_value:
      - lvgl.widget.update:
          id: btn_fan_focus
          state:
            checked: !lambda return x == "focus";
      - lvgl.widget.update:
          id: btn_fan_auto
          state:
            checked: !lambda return x == "auto";
      - lvgl.widget.update:
          id: btn_fan_high
          state:
            checked: !lambda return x == "high";
