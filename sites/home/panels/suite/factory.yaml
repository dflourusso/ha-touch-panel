packages:
  core: !include panel.yaml

esphome:
  project:
    name: dflourusso.ha-touch-panel
    # Must stay "dev" — release.yml sed-replaces this with version+build_number.
    version: "dev"

http_request:

ota:
  - platform: http_request
    id: ota_http_request

update:
  - platform: http_request
    name: Firmware
    device_class: firmware
    source: https://dflourusso.github.io/ha-touch-panel/firmware/home-suite.manifest.json
    # Short while iterating; raise (e.g. 6h) once the project is stable.
    update_interval: 2min
